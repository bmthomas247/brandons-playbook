<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brandon's Playbook</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="book.css">
<style>
:root{--navy:#0b1f3a;--navy2:#13315c;--amber:#f59e0b;--bg:#f1f5f9;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px;flex:1}
.brand span{color:var(--amber)}
#search{width:100%;margin-top:8px;padding:10px 12px;border-radius:10px;border:0;font-size:16px}
.demo{background:var(--amber);color:#111;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px}
.hbtn{background:none;border:1px solid #ffffff44;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
main{flex:1;min-width:0;max-width:860px;padding:12px 16px 96px}
.wrap{display:flex;max-width:1100px;margin:0 auto}
.rail{position:sticky;top:104px;align-self:flex-start;width:96px;flex:none;display:flex;flex-direction:column;gap:6px;padding:12px 0 96px 10px;max-height:calc(100vh - 104px);overflow-y:auto}
.rb{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:13px;font-weight:800;color:var(--navy2);text-decoration:none;line-height:1.2}
.rb small{display:block;font-size:10px;font-weight:600;color:var(--mute);margin-top:2px}
.rb.on{background:var(--navy2);color:#fff;border-color:var(--navy2)} .rb.on small{color:#cbd5e1}
.rb.sub{margin-left:12px;padding:7px 8px;font-size:12px}
h2.sh{margin:4px 0 2px;color:var(--navy2);font-size:20px}
@media(min-width:700px){.rail{width:150px}}
@media(max-width:699px){body.playpage .rail{display:none} .rail .ri{display:none}}
.side{display:none}
@media(min-width:700px){
 nav.tabs,.rail{display:none !important}
 main{padding-bottom:40px}
 .wrap{max-width:1300px}
 .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:104px;align-self:flex-start;width:230px;flex:none;padding:14px 8px 40px 14px;max-height:calc(100vh - 104px);overflow-y:auto}
 .st-tab{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-weight:800;font-size:15px;color:var(--navy2);text-decoration:none;background:#fff;border:1px solid var(--line)}
 .st-tab b{font-size:18px}
 .st-tab.on{background:var(--navy2);color:#fff;border-color:var(--navy2);box-shadow:inset 4px 0 0 var(--amber)}
 .side-sec{display:flex;flex-direction:column;gap:5px;margin:2px 0 8px 18px}
 .side-sec .rb{padding:8px 10px;font-size:13px}
 .side-sec .rb.sub{margin-left:14px}
 .ri{display:block;margin-left:12px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border-left:2px solid var(--line)}
 .ri.sub{margin-left:26px}
 .rc{margin:6px 0 0 12px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--amber)}
 .rc.sub{margin-left:26px}
 .ri.cv{margin-left:38px}
 .ri:hover{color:var(--navy2);border-left-color:var(--amber)}
 .ri.on{color:var(--navy2);font-weight:800;border-left:3px solid var(--amber);background:#fff7ed}
}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{flex:1;text-align:center;padding:10px 0 8px;color:var(--mute);text-decoration:none;font-size:11px;font-weight:700}
nav.tabs a b{display:block;font-size:19px;margin-bottom:2px}
nav.tabs a.on{color:var(--navy2);box-shadow:inset 0 3px 0 var(--amber)}
h2.fam{font-size:12px;letter-spacing:1.2px;color:var(--navy2);margin:18px 0 8px;text-transform:uppercase}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;text-decoration:none;color:inherit}
.card .n{font-weight:800;color:var(--amber);width:30px;font-size:15px}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font-size:15px}
.card .t small{color:var(--mute);font-size:12px}
.st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.st-installed{background:#dcfce7;color:#166534}.st-build{background:#ffedd5;color:#9a3412}.st-care{background:#fee2e2;color:#991b1b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--navy2);text-decoration:none}
.chip.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.ph{display:flex;align-items:flex-start;gap:10px;margin:6px 0 4px}
.ph .n{font-size:26px;font-weight:800;color:var(--amber)}
.ph h1{margin:0;font-size:24px;color:var(--navy2)}
.ph .call{color:var(--mute);font-size:13px;margin-top:2px}
.diagram svg{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#1e3a8a}
.sec.attack{background:#fff7ed;border-color:#fed7aa}
.sec p,.sec li{font-size:14.5px;line-height:1.5;margin:0}
.sec ul{margin:0;padding-left:18px}
table.asg{width:100%;border-collapse:collapse}
table.asg td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
table.asg td.pos{width:44px;font-weight:800;color:var(--navy2);font-size:15px}
.conf{font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.conf-book,.conf-confirmed{background:#dcfce7;color:#166534}.conf-inferred{background:#fef3c7;color:#92400e}
.btn{display:inline-block;background:var(--navy2);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mute{color:var(--mute);font-size:13px}
.login{max-width:380px;margin:12vh auto;text-align:center;background:#fff;padding:28px 22px;border-radius:16px;border:1px solid var(--line)}
.login input{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line);margin:12px 0}
.posjob{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:block;text-decoration:none;color:inherit}
.posjob b{color:var(--navy2)} .posjob .j{font-size:14px;margin-top:4px;line-height:1.45}
.cfam{border:1px dashed #fcd34d;border-radius:14px;padding:8px 8px 0;margin:4px 0 10px;background:#fffbeb} .cfh{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#b45309;margin:0 4px 6px} .cfh span{font-weight:600;color:var(--mute);text-transform:none;letter-spacing:0}
.callbox{border-left:4px solid var(--amber)} .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0} .ctab{border-collapse:collapse;margin-top:4px;font-size:13.5px} .ctab td{padding:2px 10px 2px 0} .ctab td:first-child{font-weight:800;color:var(--navy2)}
.book{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;overflow:hidden}
textarea{width:100%;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);font-family:inherit}
dialog{border:0;border-radius:14px;padding:16px;width:min(520px,92vw)}
dialog select,dialog input{font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);width:100%;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const CFG = window.PIRATE_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL;
const sb = DEMO ? null : supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const POS = ['Q','T','F','X','Z','Y','H','S','OL'];
const POSNAME = {Q:'Quarterback',T:'Tailback',F:'Fullback',X:'Split end',Z:'Flanker',Y:'Tight end (anchor)',H:'2nd TE (mover)',S:'Slot',OL:'Offensive line'};
const TABS = [['form','Formations','📐'],['run','Run','🏈'],['pass','Pass','🎯'],['prot','Protection','🛡️'],['pos','Positions','👥'],['learn','Learn','📘']];
const SECTIONS = {
  prot: [['all','All']],
  run:  [['all','All'],['zone','Zone','RUN · ZONE'],['power','Power','RUN · POWER'],['counter','Counter','RUN · COUNTER'],['edge','Edge / Toss','RUN · EDGE / TOSS']],
  form: [['all','All'],['p11','11 Personnel','FORMATIONS','11'],['p12','12 Personnel','FORMATIONS','12'],['p21','21 Personnel','FORMATIONS','21'],['p22','22 Personnel','FORMATIONS','22'],['p23','23 Personnel','FORMATIONS','23']],
  pass: [['all','All'],['half','½ Field','PASS · HALF-FIELD'],['half-2','2 WR','PASS · HALF-FIELD','2 WR',true],['half-3','3 WR','PASS · HALF-FIELD','3 WR',true],['full','Full Field','PASS · FULL-FIELD'],['screens','Screens','PASS · SCREENS'],['roll','Rollouts','PASS · ROLLOUTS'],['rb','RB Routes','PASS · RB ROUTES']]
};
const RUN_PHASES = ['run','rpo','goal line'];
const tabOf = p => p.phase==='formation' ? 'form' : p.phase==='protection' ? 'prot' : RUN_PHASES.includes(p.phase) ? 'run' : 'pass';
let S = {plays:[], asg:[], pages:[], admin:false, user:null};
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot(){
  if (DEMO){
    const d = await (await fetch('demo-data.json')).json();
    S.hidden = d.plays.filter(x=>x.hidden); S.plays = d.plays.filter(x=>!x.hidden); S.asg = d.assignments; S.pages = d.pages; S.admin = true; S.user = {email:'demo'};
    return route();
  }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return loginView();
  S.user = session.user;
  await load();
  route();
}
async function load(){
  const [p,a,g] = await Promise.all([
    sb.from('plays').select('*').order('sort'),
    sb.from('assignments').select('*'),
    sb.from('pages').select('*').order('sort')]);
  if (p.error) { return noAccess(p.error.message); }
  S.hidden = p.data.filter(x=>x.hidden); S.plays = p.data.filter(x=>!x.hidden); S.asg = a.data||[]; S.pages = g.data||[]; S.admin = true;
  if (!S.plays.length) return noAccess();
}
function loginView(msg){
  $('#app').innerHTML = `<div class="login"><div style="font-size:42px">⚓</div><h2 style="margin:6px 0;color:#13315c">Brandon's Playbook</h2>
  <p class="mute">Private. Enter your email and we'll send a sign-in link.</p>
  <input id="em" type="email" placeholder="you@email.com" autocomplete="email"><button class="btn" id="go" style="width:100%">Send link</button>
  <p class="mute" id="msg">${msg||''}</p></div>`;
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(); if (!email) return;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname, shouldCreateUser: email.toLowerCase() === 'bmooset@gmail.com' }});
    $('#msg').textContent = error ? error.message : 'Check your email for the link.';
  };
}
function noAccess(m){
  $('#app').innerHTML = `<div class="login"><h3>No access yet</h3><p class="mute">${esc(S.user?.email)} doesn't have access.</p><p class="mute">${esc(m||'')}</p><button class="btn alt" onclick="signOut()">Sign out</button></div>`;
}
async function signOut(){ if (sb) await sb.auth.signOut(); location.hash=''; location.reload(); }

function shell(tab, body, rail){
  const q = (S.q||'');
  $('#app').innerHTML = `<header><div class="hrow"><div class="brand">⚓ BRANDON'S <span>PLAYBOOK</span></div>${DEMO?'<span class="demo">DEMO</span>':''}
   <button class="hbtn" onclick="signOut()">${DEMO?'↻':'Out'}</button></div>
   <input id="search" type="search" placeholder="Search plays, calls, routes…" value="${esc(q)}"></header>
   <div class="wrap"><aside class="side">${TABS.map(([k,l,i])=>`<a href="#/${k}" class="st-tab ${k===tab?'on':''}"><b>${i}</b>${l}</a>${k===tab&&rail?`<div class="side-sec">${rail}</div>`:''}`).join('')}</aside>${rail?`<aside class="rail">${rail}</aside>`:''}<main>${body}</main></div>
   <nav class="tabs">${TABS.map(([k,l,i])=>`<a href="#/${k}" class="${k===tab?'on':''}"><b>${i}</b>${l}</a>`).join('')}</nav>`;
  const s = $('#search');
  s.oninput = () => { S.q = s.value; if (location.hash !== '#/search') location.hash = '#/search'; else route(); };
  if (tab === 'search') { s.focus(); s.setSelectionRange(q.length,q.length); }
}
function stClass(s){ s=(s||'').toLowerCase(); return s.includes('installed')?'st-installed':s.includes('care')||s.includes('if')?'st-care':'st-build'; }
function card(p){
  return `<a class="card" href="#/play/${p.id}"><div class="n">${esc(p.num)}</div><div class="t"><b>${esc(p.name)}</b><small>${esc(p.call_name)} · ${esc(p.formation)}</small></div><span class="st ${stClass(p.status)}">${esc(p.status)}</span></a>`;
}
function conceptCards(list){
  const seen = {}; let out = '';
  list.forEach(p=>{
    if (p.concept){ if (seen[p.concept]) return; seen[p.concept]=1;
      const fam = list.filter(x=>x.concept===p.concept);
      out += `<div class="cfam"><div class="cfh">${esc(p.concept)} concept <span>· ${fam.length} variants</span></div>${fam.map(card).join('')}</div>`;
    } else out += card(p);
  });
  return out;
}
function grouped(list){
  const fams = []; list.forEach(p => { if (!fams.includes(p.family)) fams.push(p.family); });
  return fams.map(f => `<h2 class="fam">${esc(f)}</h2>` + conceptCards(list.filter(p=>p.family===f))).join('');
}
function railHTML(kind, cur, pid){
  const secs = SECTIONS[kind];
  return secs.map(([k,l,fam,sub,child])=>{
    let out = `<a class="rb ${child?'sub':''} ${k===cur?'on':''}" href="#/${kind}/${k}">${l}</a>`;
    if (!fam) return out;
    const hasKids = !sub && secs.some(x=>x[2]===fam && x[3]);
    const open = kind==='form' || k===cur || (hasKids && secs.some(x=>x[2]===fam && x[3] && x[0]===cur));
    if (!open || (hasKids && kind!=='form')) return out;
    const raw = S.plays.filter(p=>p.family===fam && (!sub || p.subgroup===sub));
    const items = []; raw.forEach(p=>{ if (items.includes(p)) return; if (p.concept) raw.filter(x=>x.concept===p.concept).forEach(x=>items.push(x)); else items.push(p); });
    const seen = {};
    return out + items.map(p=>{
      let h = '';
      if (p.concept && !seen[p.concept]) { seen[p.concept]=1; h = `<div class="rc ${child?'sub':''}">${esc(p.concept)} concept</div>`; }
      return h + `<a class="ri ${child?'sub':''} ${p.concept?'cv':''} ${p.id===pid?'on':''}" href="#/play/${p.id}">${esc(p.name)}</a>`;
    }).join('');
  }).join('');
}
function listView(kind, sec){
  sec = sec || 'all';
  const all = S.plays.filter(p => tabOf(p)===kind);
  const def = SECTIONS[kind].find(x=>x[0]===sec) || SECTIONS[kind][0];
  let list = def[2] ? all.filter(p=>p.family===def[2]) : all;
  if (def[3]) list = list.filter(p=>p.subgroup===def[3]);
  const head = `<h2 class="sh">${esc(def[0]==='all'?(kind==='run'?'All runs':kind==='prot'?'Protections':'All passes'):def[1])}</h2><div class="mute">${list.length} plays · ${list.filter(p=>/installed/i.test(p.status)).length} installed</div>`;
  const callbox = def[0]==='all' ? (kind==='run' ? CALLBOX : kind==='prot' ? pgHTML('protection') : (pgHTML('call-pass')||PASSBOX)) : '';
  const body = callbox + ((def[2]==='PASS · HALF-FIELD' && !def[3])
    ? ['2 WR','3 WR'].map(g=>`<h2 class="fam">${g} sets</h2>`+conceptCards(list.filter(p=>p.subgroup===g))).join('')
    : grouped(list));
  shell(kind, head + body, railHTML(kind, sec));
}
const CALLBOX = '<div class="sec callbox"><h3>How we call the run</h3><p style="margin-bottom:6px"><b>Two digits.</b> 1st number = <b>who gets the ball</b>. 2nd number = <b>what hole</b>. Then the scheme word.</p><div class="cgrid"><div><b>1st # — ball carrier</b><table class="ctab"><tr><td>1</td><td>QB</td></tr><tr><td>2</td><td>Tailback</td></tr><tr><td>3</td><td>Fullback</td></tr><tr><td>4</td><td>Motion / jet man</td></tr></table></div><div><b>2nd # — the hole</b><table class="ctab"><tr><td>Odd</td><td>Left</td></tr><tr><td>Even</td><td>Right</td></tr><tr><td>1·2</td><td>A gap</td></tr><tr><td>3·4</td><td>B gap</td></tr><tr><td>5·6</td><td>C gap / off-tackle</td></tr><tr><td>7·8</td><td>D gap / edge</td></tr></table></div></div><svg viewBox="0 0 500 112" style="width:100%;max-width:520px;height:auto;display:block;margin:6px 0"><text x="10" y="108" font-size="11" font-weight="800" fill="#13315c" font-family="Arial">◄ ODD = LEFT</text><text x="490" y="108" font-size="11" font-weight="800" fill="#13315c" text-anchor="end" font-family="Arial">EVEN = RIGHT ►</text><circle cx="222" cy="18" r="12" fill="#f59e0b"/><text x="222" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">1</text><circle cx="270" cy="18" r="12" fill="#f59e0b"/><text x="270" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">2</text><circle cx="174" cy="18" r="12" fill="#f59e0b"/><text x="174" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">3</text><circle cx="318" cy="18" r="12" fill="#f59e0b"/><text x="318" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">4</text><circle cx="126" cy="18" r="12" fill="#f59e0b"/><text x="126" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">5</text><circle cx="366" cy="18" r="12" fill="#f59e0b"/><text x="366" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">6</text><circle cx="70" cy="18" r="12" fill="#f59e0b"/><text x="70" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">7</text><circle cx="430" cy="18" r="12" fill="#f59e0b"/><text x="430" y="23" font-size="13" font-weight="800" fill="#111" text-anchor="middle" font-family="Arial">8</text><rect x="137" y="40" width="26" height="26" rx="3" fill="#1e3a8a"/><text x="150" y="57" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">T</text><rect x="185" y="40" width="26" height="26" rx="3" fill="#1e3a8a"/><text x="198" y="57" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">G</text><rect x="233" y="40" width="26" height="26" rx="3" fill="#1e3a8a"/><text x="246" y="57" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">C</text><rect x="281" y="40" width="26" height="26" rx="3" fill="#1e3a8a"/><text x="294" y="57" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">G</text><rect x="329" y="40" width="26" height="26" rx="3" fill="#1e3a8a"/><text x="342" y="57" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">T</text><circle cx="390" cy="53" r="13" fill="#1e3a8a"/><text x="390" y="58" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">Y</text><text x="222" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">A</text><text x="270" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">A</text><text x="174" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">B</text><text x="318" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">B</text><text x="126" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">C</text><text x="366" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">C</text><text x="70" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">D</text><text x="430" y="88" font-size="10" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="Arial">D</text></svg><p><b>Examples:</b> <b>25 Power</b> = tailback, C gap left, Power scheme · <b>22 Iso</b> = tailback, A gap right · <b>48 Jet</b> = jet man, edge right.</p><p class="mute" style="margin-top:6px">Scheme word tells the line who pulls: ZONE = nobody · POWER = backside guard pulls · COUNTER = guard kicks, H/F wraps.</p></div>';
const PASSBOX = '<div class="sec callbox"><h3>How we call the pass</h3><p style="margin-bottom:6px"><b>FORMATION + DIRECTION · PLAY · PROTECTION</b></p><table class="ctab"><tr><td>Formation</td><td>Ace Right, Trey Left, Rhino Right…</td></tr><tr><td>Play</td><td>½ field: two concept words, <b>always called LEFT to RIGHT</b>. Full field: one word (Mesh, 4 Verts, Drive, Y-Cross).</td></tr><tr><td>Protection</td><td>O-line protection word last <span class="mute">(words to come)</span></td></tr></table><p style="margin-top:8px"><b>Example: Ace Right · Smash Snag · [protection]</b><br>Left side runs <b>Smash</b> (2-man). Right side runs <b>Snag</b> (3-man), so the <b>RB is the 3rd receiver</b> on the right side.</p><p class="mute" style="margin-top:6px">RBs learn every 3 WR concept: anytime a 3-man concept is called to a 2-receiver side, the RB runs the 3rd route.</p></div>';
const pgHTML = slug => { const g = (S.pages||[]).find(x=>x.slug===slug); return g ? g.html : ''; };
const PERS = {'11':'1 back · 1 TE · 3 WR','12':'1 back · 2 TE · 2 WR','21':'2 backs · 1 TE · 2 WR','22':'2 backs · 2 TE · 1 WR','23':'2 backs · 3 TE · 0 WR'};
function formView(sec){
  sec = sec || 'all';
  const def = SECTIONS.form.find(x=>x[0]===sec) || SECTIONS.form[0];
  const all = S.plays.filter(p=>p.phase==='formation');
  const groups = def[3] ? [def[3]] : ['11','12','21','22','23'];
  const fcard = p=>`<a class="card" href="#/play/${p.id}"><div class="n">${esc(p.num)}</div><div class="t"><b>${esc(p.name)}</b><small>${esc(p.call_name)}</small></div></a>`;
  const body = groups.map(g=>{ const l = all.filter(p=>p.subgroup===g); return l.length ? `<h2 class="fam">${g} personnel <span style="text-transform:none;letter-spacing:0;color:var(--mute);font-weight:600">· ${PERS[g]}</span></h2>`+l.map(fcard).join('') : ''; }).join('');
  shell('form', `<h2 class="sh">${def[0]==='all'?'Formations':esc(def[1])}</h2><div class="mute">Direction = the TE (Y) side · Gun is a tag (Ace Gun, Trey Gun, Trident Gun) · Empty is always gun</div>` + (def[0]==='all' ? pgHTML('motions') : '') + body, railHTML('form', sec));
}
function searchView(){
  const q = (S.q||'').toLowerCase().trim();
  const hits = !q ? [] : S.plays.filter(p => [p.name,p.call_name,p.formation,p.family,p.what,p.attack,p.why,(p.keys||[]).join(' ')]
      .join(' ').replace(/<[^>]+>/g,'').toLowerCase().includes(q) || S.asg.some(a=>a.play_id===p.id && a.job.toLowerCase().includes(q)));
  shell('search', q ? `<div class="mute">${hits.length} results</div>` + hits.map(card).join('') : '<p class="mute">Type to search.</p>');
}
function playView(id){
  const p = S.plays.find(x=>x.id===id); if (!p) return listView('run');
  const tab = tabOf(p);
  const sk = ((SECTIONS[tab].find(x=>x[2]===p.family && x[3] && x[3]===p.subgroup) || SECTIONS[tab].find(x=>x[2]===p.family && !x[3]) || [])[0]);
  const asg = POS.map(pos => S.asg.find(a=>a.play_id===id && a.position===pos)).filter(Boolean);
  const blank = POS.filter(pos => !asg.find(a=>a.position===pos));
  const sib = S.plays.filter(x=>tabOf(x)===tab), i = sib.indexOf(p), prev = sib[i-1], next = sib[i+1];
  shell(tab, `
  <div class="ph"><div class="n">${esc(p.num)}</div><div><h1>${esc(p.name)}</h1><div class="call">CALL: <b>${esc(p.call_name)}</b></div>
  <div class="chips"><span class="chip">${esc(p.formation)}</span><span class="st ${stClass(p.status)}">${esc(p.status)}</span>${(p.flags||[]).map(f=>`<span class="conf conf-inferred">${esc(f)}</span>`).join('')}</div></div></div>
  <div class="diagram">${p.diagram_svg||''}</div>
  <div class="row">${p.hudl_url?`<a class="btn" href="${esc(p.hudl_url)}" target="_blank" rel="noopener">Open in Hudl ↗</a>`:'<span class="mute">No Hudl link yet.</span>'}
   ${S.admin?`<button class="btn sm alt" onclick="editHudl('${p.id}')">${p.hudl_url?'Edit':'Add'} Hudl link</button><button class="btn sm alt" onclick="setHidden('${p.id}',true)">Hide play</button>`:''}</div>
  <div class="sec"><h3>Position jobs</h3><table class="asg">${asg.map(a=>`<tr><td class="pos">${a.position}</td><td>${esc(a.job)}<span class="conf conf-${a.confidence}">${a.confidence.toUpperCase()}</span></td>
    ${S.admin?`<td style="width:44px"><button class="btn sm alt" onclick="editAsg('${p.id}','${a.position}')">Edit</button></td>`:''}</tr>`).join('')}</table>
   ${!asg.length?'<p class="mute">Not written yet.</p>':''}
   ${S.admin && blank.length?`<div class="row">${blank.map(pos=>`<button class="btn sm alt" onclick="editAsg('${p.id}','${pos}')">+ ${pos}</button>`).join('')}</div>`:''}</div>
  <div class="sec"><h3>What it does</h3><p>${p.what||''}</p></div>
  <div class="sec attack"><h3>Who we attack</h3><p>${p.attack||''}</p></div>
  <div class="sec"><h3>Why we call it</h3><p>${p.why||''}</p></div>
  ${(p.keys||[]).length?`<div class="sec"><h3>Coaching keys</h3><ul>${p.keys.map(k=>`<li>${k}</li>`).join('')}</ul></div>`:''}
  ${p.sequence?`<div class="sec"><h3>Sequence</h3><p>${esc(p.sequence)}</p></div>`:''}
  <div class="row" style="justify-content:space-between">${prev?`<a class="btn alt sm" href="#/play/${prev.id}">‹ ${esc(prev.name)}</a>`:'<span></span>'}${next?`<a class="btn alt sm" href="#/play/${next.id}">${esc(next.name)} ›</a>`:''}</div>`, railHTML(tab, sk || 'all', p.id));
  window.scrollTo(0,0);
}
function posView(pos){
  pos = pos || 'Q';
  const rows = S.plays.filter(p=>p.phase!=='formation').map(p => ({p, a:S.asg.find(a=>a.play_id===p.id && a.position===pos)}));
  const have = rows.filter(r=>r.a), miss = rows.filter(r=>!r.a);
  shell('pos', `
   <h2 class="fam">${POSNAME[pos]} — your job on every play</h2>
   <div class="mute">${have.length} written · ${miss.length} still to write</div>
   ${['run','pass'].map(k=>{ const r = have.filter(x=> k==='run'?RUN_PHASES.includes(x.p.phase):!RUN_PHASES.includes(x.p.phase));
     return r.length?`<h2 class="fam">${k==='run'?'Run':'Pass'}</h2>`+r.map(({p,a})=>`<a class="posjob" href="#/play/${p.id}"><b>${esc(p.num)} · ${esc(p.name)}</b> <span class="conf conf-${a.confidence}">${a.confidence.toUpperCase()}</span><div class="j">${esc(a.job)}</div></a>`).join(''):''}).join('')}
   ${miss.length?`<details class="sec"><summary class="mute">Not written yet (${miss.length})</summary>${miss.map(({p})=>`<div><a href="#/play/${p.id}">${esc(p.num)} ${esc(p.name)}</a></div>`).join('')}</details>`:''}`, POS.map(x=>`<a class="rb ${x===pos?'on':''}" href="#/pos/${x}">${x}<small>${POSNAME[x]}</small></a>`).join(''));
}
function learnView(slug){
  if (slug){
    const g = S.pages.find(x=>x.slug===slug);
    return shell('learn', `<a class="mute" href="#/learn">‹ Learn</a><h1 style="color:#13315c;font-size:22px">${esc(g?.title)}</h1><div class="book">${g?.html||''}</div>`);
  }
  const secs = []; S.pages.forEach(g=>{ if(!secs.includes(g.section)) secs.push(g.section); });
  const hid = (S.hidden||[]).length ? `<h2 class="fam">Hidden plays (${S.hidden.length})</h2>` + S.hidden.map(p=>`<div class="card"><div class="n">${esc(p.num)}</div><div class="t"><b>${esc(p.name)}</b><small>${esc(p.family)}</small></div><button class="btn sm alt" onclick="setHidden('${p.id}',false)">Unhide</button></div>`).join('') : '';
  shell('learn', secs.map(s=>`<h2 class="fam">${esc(s)}</h2>`+S.pages.filter(g=>g.section===s).map(g=>`<a class="card" href="#/learn/${g.slug}"><div class="t"><b>${esc(g.title)}</b></div>›</a>`).join('')).join('') + hid);
}
function route(){
  document.body.classList.toggle('playpage', (location.hash||'').startsWith('#/play/'));
  const [_, v, id] = (location.hash||'#/form').split('/');
  if (v==='play') return playView(id);
  if (v==='run') return listView('run', id);
  if (v==='pos') return posView(id);
  if (v==='learn') return learnView(id);
  if (v==='search') return searchView();
  if (v==='pass') return listView('pass', id);
  if (v==='prot') return listView('prot', id);
  if (v==='form') return formView(id);
  return formView();
}
window.addEventListener('hashchange', route);

// ---------- admin edits ----------
function dlg(html){ const d=$('#dlg'); d.innerHTML=html; d.showModal(); return d; }
function editAsg(pid,pos){
  const a = S.asg.find(x=>x.play_id===pid && x.position===pos) || {job:'',confidence:'confirmed'};
  dlg(`<h3 style="margin-top:0">${pid} · ${pos} — ${POSNAME[pos]}</h3><textarea id="job" rows="4">${esc(a.job)}</textarea>
   <select id="conf"><option value="confirmed">CONFIRMED (coach signed off)</option><option value="book">BOOK</option><option value="inferred">INFERRED</option></select>
   <div class="row"><button class="btn" id="sv">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button>${a.play_id?'<button class="btn alt" id="del">Delete</button>':''}</div>`);
  $('#conf').value = a.play_id ? a.confidence : 'confirmed';
  $('#sv').onclick = async () => {
    const row = {play_id:pid, position:pos, job:$('#job').value.trim(), confidence:$('#conf').value};
    if (!row.job) return;
    if (!DEMO){ const {error} = await sb.from('assignments').upsert(row); if (error) return alert(error.message); }
    S.asg = S.asg.filter(x=>!(x.play_id===pid&&x.position===pos)).concat(row); $('#dlg').close(); route();
  };
  if ($('#del')) $('#del').onclick = async () => {
    if (!DEMO){ const {error} = await sb.from('assignments').delete().match({play_id:pid, position:pos}); if (error) return alert(error.message); }
    S.asg = S.asg.filter(x=>!(x.play_id===pid&&x.position===pos)); $('#dlg').close(); route();
  };
}
function editHudl(pid){
  const p = S.plays.find(x=>x.id===pid);
  dlg(`<h3 style="margin-top:0">Hudl link — ${esc(p.name)}</h3><input id="hu" type="url" placeholder="https://www.hudl.com/..." value="${esc(p.hudl_url)}">
   <div class="row"><button class="btn" id="sv">Save</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`);
  $('#sv').onclick = async () => {
    const v = $('#hu').value.trim() || null;
    if (v && !/^https:\/\//.test(v)) return alert('Use an https:// link');
    if (!DEMO){ const {error} = await sb.from('plays').update({hudl_url:v}).eq('id',pid); if (error) return alert(error.message); }
    p.hudl_url = v; $('#dlg').close(); route();
  };
}
async function setHidden(pid,h){
  if (!DEMO){ const {error} = await sb.from('plays').update({hidden:h}).eq('id',pid); if (error) return alert(error.message); }
  const all = S.plays.concat(S.hidden); const p = all.find(x=>x.id===pid); p.hidden = h;
  all.sort((a,b)=>a.sort-b.sort); S.plays = all.filter(x=>!x.hidden); S.hidden = all.filter(x=>x.hidden);
  location.hash = h ? '#/'+tabOf(p) : '#/play/'+pid; route();
}
if (sb) sb.auth.onAuthStateChange((e)=>{ if (e==='SIGNED_IN' && !S.plays.length) boot(); });
boot();
</script>
